<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generar clave de administrador</title>
<style>
  :root{color-scheme:light dark;--fondo:#F2F2F7;--sup:#FFFFFF;--sup2:#F7F7FA;--sep:#DCDCE1;--tx:#1C1C1E;--gris:#636366;--acento:#0B5CD5;--boton:#0B5CD5;--suave:#E8F0FD}
  @media (prefers-color-scheme:dark){:root{--fondo:#000;--sup:#1C1C1E;--sup2:#242427;--sep:#38383A;--tx:#F2F2F7;--gris:#A1A1A6;--acento:#5AA2FF;--boton:#1A66D6;--suave:#16294A}}
  body{font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--tx);margin:0;padding:24px 16px;font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .caja{max-width:640px;margin:0 auto;background:var(--sup);border-radius:26px;padding:28px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05)}
  h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:0}
  label{font-weight:600;font-size:14px;color:var(--gris);display:block;margin:16px 0 6px}
  input{width:100%;box-sizing:border-box;min-height:44px;padding:11px 14px;font-size:17px;border:1px solid var(--sep);border-radius:12px;background:var(--sup2);color:var(--tx)}
  input:focus{outline:none;border-color:var(--acento);box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 45%,transparent)}
  button{margin-top:14px;min-height:50px;padding:12px 22px;font-size:17px;font-weight:600;border:0;border-radius:14px;background:var(--boton);color:#fff;cursor:pointer}
  code{display:block;word-break:break-all;background:var(--suave);padding:14px;border-radius:12px;margin-top:14px;font-size:14px}
  p{color:var(--gris)}
</style>
</head>
<body>
<div class="caja">
  <h1>Generar clave de administrador</h1>
  <p>Escriba la clave nueva. Se convierte en un código (SHA-256) que usted pega en <b>js/config.js</b>, en la línea <b>claveAdminHash</b>. Esta página no guarda ni envía nada.</p>
  <label for="c">Clave nueva</label>
  <input id="c" type="text" autocomplete="off">
  <button id="b">Generar código</button>
  <code id="r">El código aparecerá aquí</code>
  <button id="copiar" hidden>Copiar código</button>
</div>
<script>
document.getElementById('b').onclick = async function () {
  var t = document.getElementById('c').value;
  if (!t) return;
  if (!(window.crypto && crypto.subtle)) { document.getElementById('r').textContent = 'Abra esta página desde https:// o localhost.'; return; }
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  var hex = Array.from(new Uint8Array(buf)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
  document.getElementById('r').textContent = hex;
  document.getElementById('copiar').hidden = false;
};
document.getElementById('copiar').onclick = function () {
  navigator.clipboard.writeText(document.getElementById('r').textContent);
  this.textContent = 'Copiado ✓';
};
</script>
</body>
</html>
